<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Variables</title>

</head>

<body>

    <script>
        let variable1 = 16;
        console.log(variable1);

        let calculatedValue = variable1 * 2;
        console.log(calculatedValue);

        let result = calculatedValue + 10;
        console.log(result);

        let message = "The final result is: " + result;
        console.log(message);

        variable1 = 20;
        console.log(variable1);

        variable1 = variable1 + 5;
        console.log(variable1);

    </script>
</body>

</html>
