<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Document</title>
    <style>
      .red-button {
        background-color: red;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 12px 16px;
        font-size: 14px;
        cursor: pointer;
      }
      .yellow-button {
        background-color: yellow;
        color: black;
        border: none;
        border-radius: 4px;
        padding: 12px 16px;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button class="red-button" onclick="alert('Red button clicked!')">Click Me!</button>
    <p> This is a <button class="yellow-button" onclick="alert('Yellow button clicked!')">yellow button</button> button paragraph. </p>
  </body>
