<!DOCTYPE html>
<html lang="en">

<head>
    <title>
        DOM Projects
    </title>

</head>

<body>
    <p>YouTube Subscribe Button</p>
    <Button onclick="subscribe()" class="js-subscribe-button">Subscribe</Button>

    <p> Amazon Shipping Calculator</p>
    <input type="number" class="js-cost-input" onkeydown="handleConstKeys(event)" placeholder="Cost of order">
    <button onclick="calculateShipping()">Calculate</button>
    <p class="js-cost-total">Total cost</p>


    <script>
        function subscribe() {
            const buttonElement = document.querySelector('.js-subscribe-button');
            if (buttonElement.innerText === 'Subscribe') {
                buttonElement.innerText = 'Subscribed';
            } else {
                buttonElement.innerText = 'Subscribe';
            }
        }
        function calculateShipping() {
            const input = document.querySelector('.js-cost-input');
            let cost = Number(input.value);

            if (cost < 40) {
                cost += 10;
            }

            document.querySelector('.js-cost-total')
                .innerText = 'Total cost is $' + cost;

        }
        function handleConstKeys(event) {
            if (event.key === 'Enter') {
                calculateShipping();
            }
        }

    </script>

</body>

</html>
