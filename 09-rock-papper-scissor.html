<!DOCTYPE html>
<html lang="en">

<head>
    <title>
        Rock Paper Scissors
    </title>

</head>

<body>

    <p>Rock Paper Scissors</p>
    <button onclick="playGame('Rock')" id="rock">Rock</button>
    <button onclick="playGame('Paper')" id="paper">Paper</button>
    <button onclick="playGame('Scissors')" id="scissors">Scissors</button>
    <p class="js-result"></p>
    <p class="js-moves"></p>

    <p class="js-score">Score: 0 Wins, 0 Losses, 0 Ties</p>
    <button onclick="resetGame()" id="reset">Reset Game</button>

    <script>

    </script>
</body>

</html>
<script>
    let score = JSON.parse(localStorage.getItem('score')) || { wins: 0, losses: 0, ties: 0 };

    function playGame(userMove) {

        const random = Math.random();
        let computerMove = '';
        if (random < 0.33) {
            computerMove = 'Rock';
        } else if (random < 0.66) {
            computerMove = 'Paper';
        } else {
            computerMove = 'Scissors';
        }
        console.log('Computer move:', computerMove);

        let result = '';
        if (computerMove === userMove) {
            result = "It's a tie!";
        } else if (
            (computerMove === 'Rock' && userMove === 'Scissors') ||
            (computerMove === 'Paper' && userMove === 'Rock') ||
            (computerMove === 'Scissors' && userMove === 'Paper')
        ) {
            result = "Computer wins!";
        } else {
            result = "You win!";
        }
        if (result === 'You win!') {
            score.wins += 1;
        } else if (result === 'Computer wins!') {
            score.losses += 1;
        } else {
            score.ties += 1;
        }
        localStorage.setItem('score', JSON.stringify(score));

        document.querySelector('.js-result')
            .innerHTML = result;
        document.querySelector('.js-moves')
            .innerHTML = `You played ${userMove} - Computer played ${computerMove}`;

        updateScoreDisplay();

    }
    function resetGame() {
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.removeItem('score');
        updateScoreDisplay();
    }
    function updateScoreDisplay() {
        document.querySelector('.js-score')
            .innerHTML = `Wins: ${score.wins} , Losses: ${score.losses} , Ties: ${score.ties}`;
    }


</script>
